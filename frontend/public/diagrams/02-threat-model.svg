<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Filters & Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07" />
    </filter>
    <filter id="guardrailGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#059669" flood-opacity="0.2" />
    </filter>

    <!-- Markers -->
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ea580c" />
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1200" height="680" fill="#ffffff" />

  <!-- 1. TOP CONFIRMATION EMAIL (RISKY ACTION INTERCEPTOR) -->
  <g transform="translate(680, 28)" filter="url(#cardShadow)">
    <rect width="260" height="60" rx="14" fill="#ea580c" />
    <!-- Envelope Icon ✉️ -->
    <g transform="translate(20, 16)">
      <rect x="0" y="2" width="26" height="18" rx="3" fill="none" stroke="#ffffff" stroke-width="2.2" />
      <path d="M 0 4 L 13 13 L 26 4" fill="none" stroke="#ffffff" stroke-width="2" />
    </g>
    <text x="56" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">Confirmation E-mail</text>
    <text x="56" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fed7aa">(before taking risky actions)</text>
  </g>

  <!-- Dotted Orange Connector Line from Permission Layer to Confirmation Email -->
  <path d="M 585 130 C 585 85, 660 65, 680 60" fill="none" stroke="#f97316" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#arrowOrange)" />

  <!-- 2. LARGE GREEN DASHED OUTER BOUNDARY -->
  <g transform="translate(40, 110)">
    <rect width="1120" height="540" rx="28" fill="#fafffc" stroke="#10b981" stroke-width="2" stroke-dasharray="9,6" />

    <!-- TOP CENTER: PERMISSION LAYER PILL -->
    <g transform="translate(480, -18)" filter="url(#guardrailGlow)">
      <rect width="160" height="36" rx="10" fill="#059669" />
      <text x="80" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.5">Permission Layer</text>
    </g>

    <!-- 3. USER QUESTION (Left) -->
    <g transform="translate(30, 200)" filter="url(#cardShadow)">
      <rect width="125" height="80" rx="16" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5" />
      <path d="M 45 80 L 32 98 L 58 80 Z" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round" />
      <rect x="36" y="78" width="28" height="4" fill="#ffffff" />
      <text x="62" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#1e293b">Summarize</text>
      <text x="62" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Project X...?</text>
      <text x="62" y="120" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">User Question</text>
    </g>

    <!-- 4. GUARDRAIL 1: INPUT GUARDRAIL -->
    <g transform="translate(100, 105)" filter="url(#guardrailGlow)">
      <rect width="145" height="48" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2" />
      <!-- Barrier Icon 🚧 -->
      <g transform="translate(14, 11)">
        <rect x="0" y="4" width="22" height="15" rx="2" fill="#fef08a" stroke="#065f46" stroke-width="1.6" />
        <path d="M 4 4 L 8 19 M 11 4 L 15 19 M 18 4 L 22 19" stroke="#dc2626" stroke-width="2" stroke-linecap="square" />
        <line x1="3" y1="23" x2="3" y2="26" stroke="#065f46" stroke-width="2" />
        <line x1="19" y1="23" x2="19" y2="26" stroke="#065f46" stroke-width="2" />
      </g>
      <text x="44" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#065f46">Input Guardrail</text>
    </g>

    <!-- Connector: Input Guardrail -> Question to Decompose line -->
    <path d="M 172 153 L 172 240" stroke="#10b981" stroke-width="2" />
    <path d="M 155 240 L 215 240" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowGreen)" />

    <!-- 5. DECOMPOSE NODE -->
    <g transform="translate(225, 195)" filter="url(#cardShadow)">
      <rect width="90" height="90" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="2.5" />
      <circle cx="45" cy="30" r="5" fill="#0d9488" />
      <circle cx="28" cy="50" r="4" fill="#0d9488" />
      <circle cx="45" cy="50" r="4" fill="#0d9488" />
      <circle cx="62" cy="50" r="4" fill="#0d9488" />
      <path d="M 45 35 L 45 44 M 45 44 L 28 47 M 45 44 L 62 47" stroke="#0d9488" stroke-width="2" stroke-linecap="round" />
      <text x="45" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Decompose</text>
    </g>

    <!-- SUB-QUESTIONS -->
    <!-- Branch lines -->
    <path d="M 315 240 C 335 240, 335 85, 350 85" fill="none" stroke="#0d9488" stroke-width="2" />
    <path d="M 315 240 C 335 240, 335 175, 350 175" fill="none" stroke="#0d9488" stroke-width="2" />
    <path d="M 315 240 C 335 240, 335 265, 350 265" fill="none" stroke="#0d9488" stroke-width="2" />
    <path d="M 315 240 C 335 240, 335 355, 350 355" fill="none" stroke="#0d9488" stroke-width="2" />

    <!-- Sub-Q 1 -->
    <g transform="translate(350, 60)" filter="url(#cardShadow)">
      <rect width="145" height="50" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.8" />
      <circle cx="24" cy="25" r="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" />
      <circle cx="24" cy="25" r="5" fill="#ccfbf1" />
      <text x="43" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">Project goals?</text>
    </g>
    <!-- Sub-Q 2 -->
    <g transform="translate(350, 150)" filter="url(#cardShadow)">
      <rect width="145" height="50" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.8" />
      <rect x="15" y="16" width="16" height="18" rx="3" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" />
      <line x1="19" y1="21" x2="27" y2="21" stroke="#0d9488" stroke-width="1.5" />
      <text x="40" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Tasks this quarter?</text>
    </g>
    <!-- Sub-Q 3 -->
    <g transform="translate(350, 240)" filter="url(#cardShadow)">
      <rect width="145" height="50" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.8" />
      <rect x="15" y="16" width="18" height="17" rx="3" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" />
      <line x1="15" y1="21" x2="33" y2="21" stroke="#0d9488" stroke-width="1.5" />
      <text x="40" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Deadlines changed?</text>
    </g>
    <!-- Sub-Q 4 -->
    <g transform="translate(350, 330)" filter="url(#cardShadow)">
      <rect width="145" height="50" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.8" />
      <path d="M 23 15 L 33 33 L 13 33 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
      <text x="40" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Blockers reported?</text>
    </g>

    <!-- Connectors: Sub-Q -> Tools -->
    <path d="M 495 85 L 540 85" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrowGreen)" />
    <path d="M 495 175 L 540 195" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrowGreen)" />
    <path d="M 495 265 L 540 215" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrowGreen)" />
    <path d="M 495 355 L 540 355" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrowGreen)" />

    <!-- SAAS TOOLS -->
    <!-- Gmail -->
    <g transform="translate(545, 50)" filter="url(#cardShadow)">
      <rect width="65" height="65" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2" />
      <path d="M 18 20 L 32 30 L 47 20" fill="none" stroke="#ea4335" stroke-width="3" stroke-linecap="round" />
      <rect x="18" y="20" width="29" height="20" rx="2" fill="none" stroke="#4285f4" stroke-width="2.5" />
      <text x="32" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Gmail</text>
    </g>
    <!-- Notion -->
    <g transform="translate(545, 170)" filter="url(#cardShadow)">
      <rect width="65" height="65" rx="14" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
      <text x="32" y="36" text-anchor="middle" font-family="serif" font-size="24" font-weight="900" fill="#0f172a">N</text>
      <text x="32" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Notion</text>
    </g>
    <!-- Jira -->
    <g transform="translate(545, 290)" filter="url(#cardShadow)">
      <rect width="65" height="65" rx="14" fill="#ffffff" stroke="#0052cc" stroke-width="2" />
      <path d="M 32 18 L 42 28 L 32 38 L 22 28 Z" fill="#0052cc" />
      <text x="32" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Jira</text>
    </g>

    <!-- Connectors: Tools -> Evidence -->
    <path d="M 610 82 L 640 82" stroke="#6366f1" stroke-width="2" />
    <path d="M 610 202 L 640 202" stroke="#1e293b" stroke-width="2" />
    <path d="M 610 322 L 640 322" stroke="#0052cc" stroke-width="2" />

    <!-- EVIDENCE BOXES -->
    <g transform="translate(645, 58)" filter="url(#cardShadow)">
      <rect width="80" height="50" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8" />
      <text x="40" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6b21a8">Evidence</text>
    </g>
    <g transform="translate(645, 178)" filter="url(#cardShadow)">
      <rect width="80" height="50" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8" />
      <text x="40" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6b21a8">Evidence</text>
    </g>
    <g transform="translate(645, 298)" filter="url(#cardShadow)">
      <rect width="80" height="50" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8" />
      <text x="40" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6b21a8">Evidence</text>
    </g>

    <!-- 6. GUARDRAIL 2: PII REDACTION -->
    <g transform="translate(615, 0)" filter="url(#guardrailGlow)">
      <rect width="140" height="46" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2" />
      <!-- Shield Check Icon 🛡️ -->
      <g transform="translate(14, 11)">
        <path d="M 11 2 L 20 6 L 20 12 C 20 18, 11 22, 11 22 C 11 22, 2 18, 2 12 L 2 6 Z" fill="#a7f3d0" stroke="#059669" stroke-width="1.6" />
        <path d="M 7 11 L 10 14 L 15 8" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" />
      </g>
      <text x="44" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#065f46">PII Redaction</text>
    </g>

    <!-- Connector: PII Redaction to Evidence Streams -->
    <path d="M 685 46 L 685 58" stroke="#10b981" stroke-width="2" />

    <!-- 7. GUARDRAIL 3: CITATION VALIDATION -->
    <g transform="translate(780, 50)" filter="url(#guardrailGlow)">
      <rect width="165" height="48" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2" />
      <!-- Circular Sync Check Icon 🔄 -->
      <g transform="translate(14, 12)">
        <circle cx="12" cy="12" r="10" fill="#a7f3d0" stroke="#059669" stroke-width="1.6" />
        <path d="M 8 12 L 11 15 L 17 8" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" />
      </g>
      <text x="44" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#065f46">Citation Validation</text>
    </g>

    <!-- Line from Citation Validation DOWN to Final Answer -->
    <path d="M 862 98 L 862 165" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />

    <!-- 8. GUARDRAIL 4: OUTPUT VALIDATION -->
    <g transform="translate(685, 415)" filter="url(#guardrailGlow)">
      <rect width="155" height="48" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2" />
      <!-- Document Check Icon 📄 -->
      <g transform="translate(14, 11)">
        <path d="M 2 2 L 14 2 L 20 8 L 20 22 L 2 22 Z" fill="#a7f3d0" stroke="#059669" stroke-width="1.6" />
        <path d="M 7 13 L 10 16 L 15 10" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" />
      </g>
      <text x="44" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#065f46">Output Validation</text>
    </g>

    <!-- Line from Evidence/Answer DOWN to Output Validation -->
    <path d="M 760 350 L 760 415" stroke="#10b981" stroke-width="2" />

    <!-- Convergence from Evidence to Cited Final Answer -->
    <path d="M 725 83 C 750 83, 750 200, 770 200" fill="none" stroke="#047857" stroke-width="3" />
    <path d="M 725 203 L 770 203" fill="none" stroke="#047857" stroke-width="3" />
    <path d="M 725 323 C 750 323, 750 205, 770 205" fill="none" stroke="#047857" stroke-width="3" />

    <!-- 9. CITED FINAL ANSWER (Right Speech Bubble) -->
    <g transform="translate(780, 165)" filter="url(#cardShadow)">
      <rect width="240" height="165" rx="18" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5" />
      <path d="M 35 165 L 18 185 L 55 165 Z" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5" />
      <rect x="25" y="162" width="35" height="5" fill="#ffffff" />

      <!-- Claim 1 -->
      <text x="16" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">Project X aims to expand</text>
      <text x="16" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">into new markets.</text>
      <text x="204" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#4f46e5">[1]</text>
      <line x1="16" y1="60" x2="224" y2="60" stroke="#e2e8f0" stroke-width="1" />

      <!-- Claim 2 -->
      <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">12 key tasks are planned</text>
      <text x="16" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">this quarter.</text>
      <text x="204" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#4f46e5">[2]</text>
      <line x1="16" y1="103" x2="224" y2="103" stroke="#e2e8f0" stroke-width="1" />

      <!-- Claim 3 -->
      <text x="16" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">Two deadlines were</text>
      <text x="16" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">updated last week.</text>
      <text x="204" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#4f46e5">[3]</text>

      <text x="120" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Cited Final Answer</text>
    </g>

  </g>
</svg>
