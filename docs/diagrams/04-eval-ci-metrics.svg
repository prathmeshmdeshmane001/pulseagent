<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <rect width="850" height="360" fill="#f1f5f9" rx="16" />
  <text x="425" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Continuous Evaluation &amp; CI Quality Gates</text>

  <!-- 4 Metric Cards -->
  <g transform="translate(50, 70)">
    <!-- Accuracy -->
    <rect width="170" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="85" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Overall Accuracy</text>
    <text x="85" y="68" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#10b981">100.0%</text>
    <text x="85" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#059669">Goal: &gt;= 75%</text>
  </g>

  <g transform="translate(240, 70)">
    <!-- Refusal Rate -->
    <rect width="170" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="85" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Adversarial Defense</text>
    <text x="85" y="68" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#0284c7">100.0%</text>
    <text x="85" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0369a1">9/15 blocked, 6/6 ignored</text>
  </g>

  <g transform="translate(430, 70)">
    <!-- Latency -->
    <rect width="170" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="85" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Average Latency</text>
    <text x="85" y="68" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#8b5cf6">11.7 ms</text>
    <text x="85" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6d28d9">Parallel tool dispatch</text>
  </g>

  <g transform="translate(620, 70)">
    <!-- Total Tokens -->
    <rect width="170" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="85" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Tokens / Eval Run</text>
    <text x="85" y="68" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f59e0b">36.4k</text>
    <text x="85" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b45309">Zero-cost free tier</text>
  </g>

  <!-- GitHub Actions Flow Banner -->
  <g transform="translate(50, 215)">
    <rect width="740" height="95" rx="8" fill="#1e293b" />
    <text x="370" y="35" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">GitHub Actions CI Automation (.github/workflows/eval.yml)</text>
    <text x="370" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1">Every PR runs eval/runner.py against 95 seeded fixture test cases without API costs</text>
    <text x="370" y="78" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">Publishes Shields.io Badge &amp; auto-posts evaluation summary comment to Pull Requests</text>
  </g>
</svg>
