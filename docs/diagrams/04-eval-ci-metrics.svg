<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07" />
    </filter>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 5 0 L 0 8 L 10 8 z" fill="#0d9488" />
    </marker>
    <marker id="arrowUpBlue" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 5 0 L 0 8 L 10 8 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1000" height="620" fill="#ffffff" />

  <!-- 1. TOP: 4 METRIC CARDS -->

  <!-- CARD 1: Accuracy -->
  <g transform="translate(60, 40)" filter="url(#cardShadow)">
    <rect width="195" height="210" rx="20" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
    <!-- Dartboard Target Icon 🎯 -->
    <g transform="translate(73, 24)">
      <circle cx="24" cy="24" r="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8" />
      <circle cx="24" cy="24" r="15" fill="#ffffff" stroke="#64748b" stroke-width="1.8" />
      <circle cx="24" cy="24" r="8" fill="#f1f5f9" stroke="#0284c7" stroke-width="2" />
      <circle cx="24" cy="24" r="3" fill="#0284c7" />
    </g>
    <text x="97" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Accuracy</text>
    <!-- Divider Line -->
    <line x1="25" y1="122" x2="170" y2="122" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
    <text x="97" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#0f172a">100%</text>
    <text x="97" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#059669">95 / 95 Passed (Benchmark 82%)</text>
  </g>

  <!-- CARD 2: Refusal Rate -->
  <g transform="translate(285, 40)" filter="url(#cardShadow)">
    <rect width="195" height="210" rx="20" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
    <!-- Shield with Red Cross Icon 🛡️ ❌ -->
    <g transform="translate(73, 24)">
      <circle cx="24" cy="24" r="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8" />
      <path d="M 24 10 L 35 15 L 35 24 C 35 31, 24 36, 24 36 C 24 36, 13 31, 13 24 L 13 15 Z" fill="#fee2e2" stroke="#ef4444" stroke-width="1.6" />
      <!-- Red Cross -->
      <path d="M 20 20 L 28 28 M 28 20 L 20 28" stroke="#dc2626" stroke-width="2" stroke-linecap="round" />
    </g>
    <text x="97" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Refusal Rate</text>
    <!-- Divider Line -->
    <line x1="25" y1="122" x2="170" y2="122" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
    <text x="97" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="800" fill="#0f172a">14/15 blocked</text>
    <text x="97" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#059669">100% Adversarial Defense</text>
  </g>

  <!-- CARD 3: Latency -->
  <g transform="translate(510, 40)" filter="url(#cardShadow)">
    <rect width="195" height="210" rx="20" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
    <!-- Clock / Stopwatch Icon ⏱️ -->
    <g transform="translate(73, 24)">
      <circle cx="24" cy="24" r="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8" />
      <circle cx="24" cy="24" r="14" fill="#ffffff" stroke="#64748b" stroke-width="1.8" />
      <line x1="24" y1="14" x2="24" y2="24" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
      <line x1="24" y1="24" x2="31" y2="24" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    </g>
    <text x="97" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Latency</text>
    <!-- Divider Line -->
    <line x1="25" y1="122" x2="170" y2="122" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
    <text x="97" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#0f172a">66.6ms</text>
    <text x="97" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#059669">Target &lt; 4.2s (Sub-80ms)</text>
  </g>

  <!-- CARD 4: Token Usage -->
  <g transform="translate(735, 40)" filter="url(#cardShadow)">
    <rect width="195" height="210" rx="20" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
    <!-- Microchip / CPU Icon 🔲 -->
    <g transform="translate(73, 24)">
      <circle cx="24" cy="24" r="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8" />
      <rect x="14" y="14" width="20" height="20" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.8" />
      <rect x="18" y="18" width="12" height="12" rx="2" fill="#f1f5f9" />
      <line x1="18" y1="11" x2="18" y2="14" stroke="#64748b" stroke-width="1.8" />
      <line x1="24" y1="11" x2="24" y2="14" stroke="#64748b" stroke-width="1.8" />
      <line x1="30" y1="11" x2="30" y2="14" stroke="#64748b" stroke-width="1.8" />
      <line x1="18" y1="34" x2="18" y2="37" stroke="#64748b" stroke-width="1.8" />
      <line x1="24" y1="34" x2="24" y2="37" stroke="#64748b" stroke-width="1.8" />
      <line x1="30" y1="34" x2="30" y2="37" stroke="#64748b" stroke-width="1.8" />
    </g>
    <text x="97" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Token Usage</text>
    <!-- Divider Line -->
    <line x1="25" y1="122" x2="170" y2="122" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
    <text x="97" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#0f172a">37,940</text>
    <text x="97" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#059669">Free Tier Quota Managed</text>
  </g>

  <!-- 2. CONNECTING ARROWS (GitHub Action UP to 4 Cards) -->
  <path d="M 500 340 L 500 295 L 157 295 L 157 255" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowUp)" />
  <path d="M 500 340 L 500 295 L 382 295 L 382 255" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowUp)" />
  <path d="M 500 340 L 500 295 L 607 295 L 607 255" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowUp)" />
  <path d="M 500 340 L 500 295 L 832 295 L 832 255" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowUp)" />

  <!-- 3. CENTER: GITHUB ACTION BOX -->
  <g transform="translate(405, 345)" filter="url(#cardShadow)">
    <rect width="190" height="110" rx="18" fill="#ffffff" stroke="#0d9488" stroke-width="2.2" />
    <!-- GitHub Action Blue Logo (Play/Step workflow icon) -->
    <g transform="translate(48, 14)">
      <!-- Main circle with play -->
      <circle cx="20" cy="20" r="16" fill="#2563eb" />
      <polygon points="17,14 27,20 17,26" fill="#ffffff" />
      <!-- Workflow nodes & lines -->
      <circle cx="56" cy="12" r="7" fill="#2563eb" />
      <path d="M 53 12 L 55 14 L 59 10" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="56" cy="28" r="7" fill="#2563eb" />
      <path d="M 53 28 L 55 30 L 59 26" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 36 20 L 49 12 M 36 20 L 49 28" fill="none" stroke="#2563eb" stroke-width="2.5" />
      <!-- Small lower dots -->
      <circle cx="38" cy="34" r="3" fill="#2563eb" />
      <circle cx="48" cy="34" r="3" fill="#2563eb" />
    </g>
    <text x="95" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">GitHub Action</text>
  </g>

  <!-- Arrow pointing UP from Cloud to GitHub Action -->
  <path d="M 500 500 L 500 460" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowUpBlue)" />

  <!-- 4. BOTTOM: CLOUD / REPO TRIGGER BOX -->
  <g transform="translate(430, 505)" filter="url(#cardShadow)">
    <rect width="140" height="75" rx="16" fill="#ffffff" stroke="#3b82f6" stroke-width="2.2" />
    <!-- Cloud with Git Branch Icon inside -->
    <g transform="translate(45, 12)">
      <path d="M 12 26 C 6 26, 2 22, 2 17 C 2 12, 6 9, 11 9 C 12 4, 18 1, 25 1 C 32 1, 38 5, 39 10 C 44 10, 48 14, 48 19 C 48 24, 44 26, 38 26 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
      <!-- Git branch inside cloud -->
      <circle cx="25" cy="11" r="2.5" fill="#2563eb" />
      <circle cx="18" cy="20" r="2" fill="#2563eb" />
      <circle cx="32" cy="20" r="2" fill="#2563eb" />
      <path d="M 25 13 L 25 17 M 25 17 L 18 20 M 25 17 L 32 20" stroke="#2563eb" stroke-width="1.5" />
    </g>
  </g>
</svg>
