<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="arrowUpGreen" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 5 0 L 0 8 L 10 8 z" fill="#0d9488" />
    </marker>
    <marker id="arrowUpBlue" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 5 0 L 0 8 L 10 8 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1100" height="580" fill="#ffffff" />

  <!-- 1. TOP: GIT PUSH BOX -->
  <g transform="translate(460, 35)" filter="url(#cardShadow)">
    <rect width="180" height="75" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" />
    <!-- Git Branch / Network Node Icon -->
    <g transform="translate(50, 14)">
      <circle cx="20" cy="8" r="4.5" fill="#2563eb" />
      <circle cx="60" cy="8" r="4.5" fill="#2563eb" />
      <circle cx="40" cy="18" r="4.5" fill="#2563eb" />
      <path d="M 20 8 L 40 18 L 60 8" fill="none" stroke="#2563eb" stroke-width="2" />
    </g>
    <text x="90" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Git Push</text>
  </g>

  <!-- Arrow pointing UP from Evaluation Suite to Git Push -->
  <path d="M 550 170 L 550 120" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrowUpGreen)" />

  <!-- 2. CENTER: EVALUATION SUITE PILL -->
  <g transform="translate(420, 170)" filter="url(#cardShadow)">
    <rect width="260" height="56" rx="28" fill="#ffffff" stroke="#0d9488" stroke-width="2.5" />
    <!-- Clipboard Checklist Icon 📋 -->
    <g transform="translate(24, 13)">
      <rect x="2" y="4" width="22" height="24" rx="4" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8" />
      <rect x="8" y="1" width="10" height="5" rx="1.5" fill="#0d9488" />
      <line x1="7" y1="11" x2="19" y2="11" stroke="#0d9488" stroke-width="1.6" stroke-linecap="round" />
      <line x1="7" y1="16" x2="19" y2="16" stroke="#0d9488" stroke-width="1.6" stroke-linecap="round" />
      <line x1="7" y1="21" x2="15" y2="21" stroke="#0d9488" stroke-width="1.6" stroke-linecap="round" />
    </g>
    <text x="60" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Evaluation Suite</text>
  </g>

  <!-- Central convergence junction dot -->
  <circle cx="550" cy="275" r="4.5" fill="#0d9488" />
  <path d="M 550 275 L 550 230" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrowUpGreen)" />

  <!-- Branching Lines from 5 Cards UP to Central Junction -->
  <path d="M 140 330 L 140 275 L 550 275" fill="none" stroke="#0d9488" stroke-width="2" />
  <path d="M 345 330 L 345 275 L 550 275" fill="none" stroke="#0d9488" stroke-width="2" />
  <path d="M 550 330 L 550 275" fill="none" stroke="#0d9488" stroke-width="2" />
  <path d="M 755 330 L 755 275 L 550 275" fill="none" stroke="#0d9488" stroke-width="2" />
  <path d="M 960 330 L 960 275 L 550 275" fill="none" stroke="#0d9488" stroke-width="2" />

  <!-- Arrows on top of cards -->
  <path d="M 140 330 L 140 278" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowUpGreen)" />
  <path d="M 345 330 L 345 278" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowUpGreen)" />
  <path d="M 755 330 L 755 278" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowUpGreen)" />
  <path d="M 960 330 L 960 278" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowUpGreen)" />

  <!-- 3. THE 5 EVALUATION BUCKET CARDS -->

  <!-- CARD 1: Normal Requests -->
  <g transform="translate(45, 335)" filter="url(#cardShadow)">
    <rect width="190" height="180" rx="20" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
    <!-- Speech Bubble with Checkmark Icon -->
    <g transform="translate(68, 35)">
      <rect x="0" y="0" width="54" height="42" rx="12" fill="#f0fdfa" stroke="#0284c7" stroke-width="2.5" />
      <path d="M 15 42 L 8 52 L 26 42 Z" fill="#f0fdfa" stroke="#0284c7" stroke-width="2.5" />
      <rect x="12" y="39" width="18" height="4" fill="#f0fdfa" />
      <!-- Three dots inside bubble -->
      <circle cx="17" cy="21" r="2" fill="#0284c7" />
      <circle cx="27" cy="21" r="2" fill="#0284c7" />
      <circle cx="37" cy="21" r="2" fill="#0284c7" />
    </g>
    <text x="95" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Normal Requests</text>
    <text x="95" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#059669">30 / 30 Passed (100%)</text>
  </g>

  <!-- CARD 2: Edge Cases -->
  <g transform="translate(250, 335)" filter="url(#cardShadow)">
    <rect width="190" height="180" rx="20" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
    <!-- Warning Triangle in Corner Brackets Icon -->
    <g transform="translate(68, 35)">
      <!-- Corner crop brackets -->
      <path d="M 3 12 L 3 3 L 12 3" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 45 3 L 54 3 L 54 12" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 3 35 L 3 44 L 12 44" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 45 44 L 54 44 L 54 35" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
      <!-- Warning Triangle -->
      <path d="M 28 10 L 44 38 L 12 38 Z" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round" />
      <line x1="28" y1="20" x2="28" y2="28" stroke="#b45309" stroke-width="2.2" stroke-linecap="round" />
      <circle cx="28" cy="33" r="1.5" fill="#b45309" />
    </g>
    <text x="95" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Edge Cases</text>
    <text x="95" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#059669">20 / 20 Passed (100%)</text>
  </g>

  <!-- CARD 3: Adversarial Prompts -->
  <g transform="translate(455, 335)" filter="url(#cardShadow)">
    <rect width="190" height="180" rx="20" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
    <!-- Syringe / Injection Needle Icon 💉 -->
    <g transform="translate(68, 35)">
      <g transform="translate(10, 5) rotate(45)">
        <rect x="12" y="6" width="12" height="28" rx="2" fill="#eff6ff" stroke="#0284c7" stroke-width="2" />
        <line x1="18" y1="0" x2="18" y2="6" stroke="#0284c7" stroke-width="2" />
        <line x1="14" y1="0" x2="22" y2="0" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
        <line x1="18" y1="34" x2="18" y2="44" stroke="#0284c7" stroke-width="2" />
        <line x1="15" y1="13" x2="18" y2="13" stroke="#0284c7" stroke-width="1.5" />
        <line x1="15" y1="20" x2="18" y2="20" stroke="#0284c7" stroke-width="1.5" />
        <line x1="15" y1="27" x2="18" y2="27" stroke="#0284c7" stroke-width="1.5" />
        <!-- Red poison/adversarial liquid inside -->
        <rect x="13" y="20" width="10" height="13" fill="#fecaca" />
      </g>
    </g>
    <text x="95" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Adversarial Prompts</text>
    <text x="95" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#059669">15 / 15 Passed (100%)</text>
  </g>

  <!-- CARD 4: Missing Data -->
  <g transform="translate(660, 335)" filter="url(#cardShadow)">
    <rect width="190" height="180" rx="20" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
    <!-- Document with Question Mark Icon 📄 ? -->
    <g transform="translate(72, 35)">
      <path d="M 6 0 L 32 0 L 44 12 L 44 46 L 6 46 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" />
      <path d="M 32 0 L 32 12 L 44 12" fill="none" stroke="#2563eb" stroke-width="2.2" />
      <!-- Question mark in center -->
      <text x="25" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#2563eb">?</text>
    </g>
    <text x="95" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Missing Data</text>
    <text x="95" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#059669">15 / 15 Passed (100%)</text>
  </g>

  <!-- CARD 5: Tool Failures -->
  <g transform="translate(865, 335)" filter="url(#cardShadow)">
    <rect width="190" height="180" rx="20" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
    <!-- Wrench with Red X Icon 🔧 ❌ -->
    <g transform="translate(65, 35)">
      <!-- Wrench in dark slate/blue -->
      <g transform="translate(10, 2) rotate(-35)">
        <path d="M 12 8 C 8 4, 8 -2, 14 -6 C 16 -8, 20 -8, 24 -6 L 19 -1 L 23 3 L 28 -2 C 30 2, 30 6, 26 10 C 24 12, 22 13, 20 14 L 38 40 C 40 43, 38 46, 35 48 C 32 50, 29 48, 27 45 L 9 20 C 10 16, 11 12, 12 8 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2.2" />
      </g>
      <!-- Red Cross Badge -->
      <circle cx="46" cy="38" r="11" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
      <path d="M 41 33 L 51 43 M 51 33 L 41 43" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" />
    </g>
    <text x="95" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Tool Failures</text>
    <text x="95" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#059669">15 / 15 Passed (100%)</text>
  </g>
</svg>
