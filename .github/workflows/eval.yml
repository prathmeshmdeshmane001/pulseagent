name: Evaluation Suite & CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval:
    name: Run PulseAgent Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run CI Evaluation Suite
        env:
          ENVIRONMENT: ci
          MOCK_LLM: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: sqlite+aiosqlite:///./pulseagent.db
        run: |
          python eval/runner.py --mode=ci
          python eval/generate_badge.py

      - name: Upload Evaluation Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/report/

      - name: Post Evaluation Summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'eval/report/eval_report.json';
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const m = report.metrics;
              const comment = `### 📊 PulseAgent CI Evaluation Results
            - **Accuracy**: \`${m.accuracy_percent}%\` (${m.passed_cases}/${m.total_cases})
            - **Adversarial Refusal Rate**: \`${m.refusal_rate}\`
            - **Average Latency**: \`${m.avg_latency_ms} ms\`
            - **Tokens Used**: \`${m.total_tokens_used}\`
            - **Status**: ${m.accuracy_percent >= 75 ? '✅ PASSED' : '❌ FAILED'}`;
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
